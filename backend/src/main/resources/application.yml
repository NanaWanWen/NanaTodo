server:
  port: 8080

spring:
  application:
    name: yonerp-po

  # ==================== 数据源 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/yonerp_po?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: wen911818
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ==================== 建表与初始化数据 ====================
  # 每次启动执行 schema.sql（CREATE TABLE IF NOT EXISTS）与 data.sql（INSERT IGNORE），可重复执行
  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: UTF-8

  # ==================== Redis ====================
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ==================== Jackson ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# ==================== MyBatis-Plus ====================
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# ==================== 接口文档 ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ==================== 日志 ====================
logging:
  level:
    root: info
    com.yonerp.po: debug
    com.yonerp.po.common.cache: info

# ==================== 自定义配置 ====================
yonerp:
  # 会话 TTL（秒）
  session-ttl: 28800
  # 审批超时提醒阈值（小时），仅打标记不自动改状态
  approval-timeout-hours: 48
  # AI Agent 配置
  agent:
    # LLM 提供商：dashscope（通义千问）或 zhipu（智谱）
    provider: ${AGENT_LLM_PROVIDER:dashscope}
    # 通义千问 API Key（百炼平台 https://dashscope.aliyun.com）
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    # 通义千问模型
    dashscope-model: ${DASHSCOPE_MODEL:qwen-max}
    # 智谱 API Key（https://open.bigmodel.cn）
    zhipu-api-key: ${ZHIPU_API_KEY:}
    # 智谱模型
    zhipu-model: ${ZHIPU_MODEL:glm-4-plus}
    # LLM 超时（秒）
    timeout: 60
    # 预警扫描间隔（分钟）
    alert-scan-interval-minutes: 5
